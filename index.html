<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>CASE//UNKNOWN — Murder Mystery</title>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">CONFIDENTIAL INVESTIGATION</div>
      <h1>CASE//UNKNOWN</h1>
    </div>
    <div class="case-meta">
      <span id="caseId">CASE #00000</span>
      <button id="newCaseBtn" class="btn danger">NEW CASE</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar panel">
      <div class="section-title">CASE FILE</div>
      <nav class="tabs">
        <button class="tab active" data-tab="people">PEOPLE</button>
        <button class="tab" data-tab="evidence">EVIDENCE</button>
        <button class="tab" data-tab="timeline">TIMELINE</button>
      </nav>
      <div id="sideContent"></div>
      <div class="objective">
        <div class="eyebrow">CURRENT OBJECTIVE</div>
        <p id="objectiveText"></p>
      </div>
    </aside>

    <section class="scene panel">
      <div class="scene-head">
        <div>
          <div class="eyebrow" id="roomEyebrow">LOCATION</div>
          <h2 id="roomName">Crime Scene</h2>
        </div>
        <div class="room-nav">
          <button id="prevRoom" class="square-btn" aria-label="Previous room">←</button>
          <span id="roomCount">01 / 06</span>
          <button id="nextRoom" class="square-btn" aria-label="Next room">→</button>
        </div>
      </div>
      <div id="sceneImage" class="scene-image"></div>
      <div id="sceneObjects" class="objects"></div>
      <div class="log" id="gameLog"></div>
    </section>

    <aside class="rightbar">
      <section class="panel inventory-panel">
        <div class="section-title">EVIDENCE BAG</div>
        <div id="inventory" class="inventory"></div>
      </section>
      <section class="panel interrogation-panel">
        <div class="section-title">INTERROGATION</div>
        <div id="interrogation"></div>
      </section>
    </aside>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card panel">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="js/game.js"></script>
</body>
</html>
